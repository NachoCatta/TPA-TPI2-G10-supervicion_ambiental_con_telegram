; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; Las librerías de lib/ también necesitan acceder a include/.
build_flags = -I"${PROJECT_DIR}/include"

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit SH110X @ ^2.1.15
    adafruit/Adafruit GFX Library @ ^1.11.11
    witnessmenow/UniversalTelegramBot @ ^1.3.0
    bblanchon/ArduinoJson @ ^6.21.5

; HTTPClient.h pertenece al framework Arduino ESP32; no requiere un lib_deps adicional.

; Pruebas de lógica en la computadora, sin conectar la ESP32.
[env:native]
platform = native
test_filter =
    test_logica
    test_wifi
build_flags =
    -std=gnu++11
    -I"${PROJECT_DIR}/include"
    -I"${PROJECT_DIR}/test/soporte"
